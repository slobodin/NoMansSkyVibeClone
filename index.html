<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMS Clone</title>
  </head>
  <body>
    <!-- The WebGL canvas is appended to #app by Game.ts; the HUD is plain HTML on top of it. -->
    <div id="app">
      <div id="hud">
        <div id="markers"></div>
        <pre id="debug-panel"></pre>
        <div id="crosshair"></div>
        <div id="click-to-play">Click to play</div>
        <div id="prompt"></div>
        <pre id="flight" class="hidden"></pre>
        <div id="jetpack"><div id="jetpack-fill"></div></div>
        <pre id="help"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
